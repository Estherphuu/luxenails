<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Nails | Lookbook</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & RESET (Updated from previous version)
           ========================================================================== */
        :root {
            /* Palette updated to match provided images */
            --bg-sidebar-pink: #F9EBEB; /* Soft Pastel Pink Sidebar */
            --bg-content-cream: #FDF9F3; /* Milky/Creamy Nude Content Area */
            --bg-card: #FFFFFF;
            
            --text-dark: #1A1A1A; /* Crisp dark text */
            --text-muted: #666666;
            --text-on-dark: #FFFFFF;
            
            --accent-rose-gold: #D4A373; /* Accent from previous design */
            --border-soft: #EFE7E1;
            
            /* Typography */
            --font-serif: 'Cormorant Garamond', Georgia, serif; /* High-end serif */
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif; /* Modern sans-serif */
            
            /* Layout */
            --sidebar-width: 280px;
            --radius-lg: 16px;
            --transition-smooth: all 0.3s ease-in-out;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-dark);
            background-color: var(--bg-content-cream);
            line-height: 1.6;
            display: flex; /* Sidebar layout */
            min-height: 100vh;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        ul {
            list-style: none;
        }

        /* ==========================================================================
           2. SIDEBAR NAVIGATION
           ========================================================================== */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar-pink);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-soft);
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 3rem;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .nav-link {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-dark);
            padding: 0.5rem 0;
            opacity: 0.8;
        }

        .nav-link:hover, .nav-link.active {
            opacity: 1;
            font-weight: 500;
        }

        /* ==========================================================================
           3. MAIN CONTENT AREA
           ========================================================================== */
        .main-content {
            margin-left: var(--sidebar-width); /* Push content past fixed sidebar */
            flex: 1;
            padding: 3rem;
        }

        /* Header (Book Appointment) */
        .content-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 4rem;
        }

        .btn-book {
            background-color: var(--text-dark);
            color: var(--text-on-dark);
            padding: 0.75rem 1.5rem;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 4px; /* Slightly sharper, modern button */
            transition: var(--transition-smooth);
        }

        .btn-book:hover {
            background-color: var(--accent-rose-gold);
            transform: translateY(-2px);
        }

        /* Lookbook Title */
        .lookbook-title {
            margin-bottom: 4rem;
        }

        .section-subtitle {
            font-family: var(--font-sans);
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 4rem;
            font-weight: 500;
            line-height: 1.1;
        }

        /* ==========================================================================
           4. GALLERY GRID (3 COLUMNS)
           ========================================================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 5rem;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
        }

        /* Aspect Ratio Container (1:1 Square) */
        .aspect-square {
            aspect-ratio: 1 / 1;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-card);
            margin-bottom: 0.75rem;
        }

        .aspect-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        /* Hover Effect */
        .gallery-item:hover .aspect-square img {
            transform: scale(1.03);
        }

        /* Design Label */
        .design-label {
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: var(--text-dark);
            font-weight: 400;
        }

        /* ==========================================================================
           5. RESPONSIVE DESIGN
           ========================================================================== */
        @media (max-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            :root {
                --sidebar-width: 200px;
            }
            .section-title {
                font-size: 3rem;
            }
            .main-content {
                padding: 2rem;
            }
            .sidebar {
                padding: 1.5rem;
            }
        }

        /* Mobile View (Stacked Sidebar) */
        @media (max-width: 640px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 1.5rem;
                border-right: none;
                border-bottom: 1px solid var(--border-soft);
            }
            .logo {
                margin-bottom: 1.5rem;
            }
            .nav-links {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 1rem;
            }
            .main-content {
                margin-left: 0;
                padding: 1.5rem;
            }
            .content-header {
                justify-content: center;
                margin-bottom: 2rem;
            }
            .section-title {
                font-size: 2.5rem;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       SIDEBAR NAVIGATION
       ========================================================================== -->
    <aside class="sidebar">
        <a href="#" class="logo">Luxe Nails</a>
        <nav>
            <ul class="nav-links">
                <li><a href="#" class="nav-link">Home</a></li>
                <li><a href="#" class="nav-link">About</a></li>
                <li><a href="#" class="nav-link active">Lookbook</a></li>
                <li><a href="#" class="nav-link">Eamifertinars</a></li> <!-- Preserved label -->
                <li><a href="#" class="nav-link">Eusxiperience</a></li> <!-- Preserved label -->
                <li><a href="#" class="nav-link">Caramentals</a></li> <!-- Preserved label -->
                <li><a href="#" class="nav-link">Contact</a></li>
                <li><a href="#" class="nav-link">Demoo</a></li> <!-- Preserved label -->
                <li><a href="#" class="nav-link">Contact Us</a></li>
            </ul>
        </nav>
    </aside>

    <!-- ==========================================================================
       MAIN CONTENT AREA
       ========================================================================== -->
    <main class="main-content">
        
        <!-- Header -->
        <div class="content-header">
            <a href="#" class="btn-book">Book Appointment</a>
        </div>

        <!-- Lookbook Title -->
        <div class="lookbook-title">
            <h2 class="section-title">Lookbook</h2>
            <p class="section-subtitle">The Luxe Experience</p>
        </div>

        <!-- ==========================================================================
           GALLERY GRID (3 COLUMNS)
           ========================================================================== -->
        <div class="gallery-grid">
            
            <!-- Gallery Item 1: Milky Nude -->
            <div class="gallery-item">
                <div class="aspect-square">
                    <img src="https://images.unsplash.com/photo-1632345031435-8727f6897d53?q=80&w=800&auto=format&fit=crop" 
                         alt="Milky Nude Nails - Minimalist clean girl aesthetic" 
                         loading="lazy">
                </div>
                <span class="design-label">Milky Nude</span>
            </div>

            <!-- Gallery Item 2: Chrome Glaze -->
            <div class="gallery-item">
                <div class="aspect-square">
                    <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b?q=80&w=800&auto=format&fit=crop" 
                         alt="Chrome Glaze Nails - High shine finish" 
                         loading="lazy">
                </div>
                <span class="design-label">Chrome Glaze</span>
            </div>

            <!-- Gallery Item 3: Sporty French -->
            <div class="gallery-item">
                <div class="aspect-square">
                    <img src="https://images.unsplash.com/photo-1607779097040-26e80aa78e66?q=80&w=800&auto=format&fit=crop" 
                         alt="Sporty French - Modern thin French tip design" 
                         loading="lazy">
                </div>
                <span class="design-label">Sporty French</span>
            </div>

            <!-- Gallery Item 4: Beach Bliss -->
            <div class="gallery-item">
                <div class="aspect-square">
                    <img src="https://images.unsplash.com/photo-1599948609041-999f8d689b14?q=80&w=800&auto=format&fit=crop" 
                         alt="Beach Bliss - Turquoise wave and shell design" 
                         loading="lazy">
                </div>
                <span class="design-label">Beach Bliss</span>
            </div>

            <!-- Gallery Item 5: Cat Eye Velvet -->
            <div class="gallery-item">
                <div class="aspect-square">
                    <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?q=80&w=800&auto=format&fit=crop" 
                         alt="Cat Eye Velvet - Shimmering multi-tonal magnet effect" 
                         loading="lazy">
                </div>
                <span class="design-label">Cat Eye Velvet</span>
            </div>

            <!-- Gallery Item 6: Rose Gold Glaze -->
            <div class="gallery-item">
                <div class="aspect-square">
                    <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?q=80&w=800&auto=format&fit=crop" 
                         alt="Rose Gold Glaze - Metallic pink chrome nails" 
                         loading="lazy">
                </div>
                <span class="design-label">Rose Gold Glaze</span>
            </div>

        </div>

    </main>

</body>
</html>
